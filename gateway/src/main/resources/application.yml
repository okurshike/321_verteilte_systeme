server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # localhost:8080/api/call  ->  service-02/call
            - id: service-02
              uri: lb://service-02          # lb = Adresse bei Eureka nachschlagen
              predicates:
                - Path=/api/**              # Predicate: welche Requests gehören zu dieser Route?
              filters:
                - StripPrefix=1             # Filter: "/api" wegschneiden vor dem Weiterleiten
            # localhost:8080/service01/books  ->  service-01/books (Aufgabe 2)
            - id: service-01
              uri: lb://service-01
              predicates:
                - Path=/service01/**
              filters:
                - StripPrefix=1
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "http://localhost:5173"
                allowedMethods: [GET, POST, PUT, DELETE, OPTIONS]
                allowedHeaders: "*"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
