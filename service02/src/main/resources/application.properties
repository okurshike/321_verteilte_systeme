spring.application.name=service-02
server.port=8082
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.lease-renewal-interval-in-seconds=5
# Bei Eureka mit IP statt Computername anmelden, sonst findet das Gateway den Service je nach Netzwerk nicht
eureka.instance.prefer-ip-address=true

# Pattern Timeout: Feign wartet max. 2 Sekunden auf service-01
spring.cloud.openfeign.client.config.service-01.connect-timeout=1000
spring.cloud.openfeign.client.config.service-01.read-timeout=2000
# Pattern Circuit Breaker: Feign-Aufrufe laufen über Resilience4j, bei Fehler -> BooksClientFallback
spring.cloud.openfeign.circuitbreaker.enabled=true
# Zeitlimit macht schon Feign (oben), sonst würde Resilience4j zusätzlich nach 1 Sekunde abbrechen
spring.cloud.circuitbreaker.resilience4j.disable-time-limiter=true
# Breaker öffnet schon nach 5 Aufrufen (Standard: 100), damit man es im Unterricht sieht
resilience4j.circuitbreaker.configs.default.sliding-window-size=5
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
# Pattern Logging: eigene Log-Meldungen von service-02 im Detail
logging.level.ch.bbw.pr.eureka.service02=DEBUG
