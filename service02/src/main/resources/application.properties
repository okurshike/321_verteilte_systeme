spring.application.name=service-02
server.port=8082
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.lease-renewal-interval-in-seconds=5
# Bei Eureka mit IP statt Computername anmelden, sonst findet das Gateway den Service je nach Netzwerk nicht
eureka.instance.prefer-ip-address=true

# Pattern Timeout: Feign wartet max. 2 Sekunden auf service-01
spring.cloud.openfeign.client.config.service-01.connect-timeout=1000
spring.cloud.openfeign.client.config.service-01.read-timeout=2000
# Pattern Logging: eigene Log-Meldungen von service-02 im Detail
logging.level.ch.bbw.pr.eureka.service02=DEBUG
